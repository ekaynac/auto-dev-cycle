# SPDX-License-Identifier: Apache-2.0
# Fixture definitions of the shared knowledge spec (0.1.0-draft).
# Each names its inputs (given), the act (when), the expected outcome (then),
# the invariants it exercises (invariants.md) and the milestone whose
# behaviour implements its check. Definitions only: no check runs in M0.
fixtures:
  - id: stale-view-after-finding-change
    title: A stale view after a finding changes at the same tree
    invariants: [5]
    milestone: M1
    given:
      - a review-packet view rendered from tree T, receipts R and finding F at revision 1, with its fingerprint recorded
      - finding F moves to revision 2; tree T and receipts R are unchanged
    when: the view is requested again for the same tree
    then:
      - the fingerprint recomputed from the current inputs differs from the recorded one
      - the view is regenerated, never served from the cache

  - id: same-bytes-different-lineage
    title: Identical bytes with different lineage
    invariants: [5, 6]
    milestone: M1
    given:
      - two refs with the same content digest, derived from different inputs (different lineage and restrictions)
    when: both are stored and later selected for a view
    then:
      - the blob is stored once; the refs keep distinct identity digests
      - each keeps its own restrictions; neither inherits or loses the other's

  - id: on-prem-lesson-to-open-project
    title: An on-prem-derived lesson offered to an open project
    invariants: [4, 7]
    milestone: M4
    given:
      - a framework lesson derived from a project whose policy is on-prem (floor own, verified routing, local destinations)
      - the lesson was accepted by independent review
      - a second project under the open usage profile
    when: the lesson is selected for a call of the second project to a non-local destination
    then:
      - the delivery is refused for the inherited restriction
      - acceptance alone never authorised the export

  - id: revocation-before-delivery
    title: Revocation between selection and delivery
    invariants: [7]
    milestone: M2
    given:
      - a ref selected for a call under an allowed destination
      - the destination is revoked from the source project's policy before the call is sent
    when: the call is delivered, or falls back to another destination
    then:
      - the ref is refused at delivery and at the fallback; it is named in omitted with reason restricted
      - the manifest intent never lists it as included

  - id: poisoned-builder-note
    title: A poisoned builder note offered to a reviewer
    invariants: [3]
    milestone: M1
    given:
      - a builder's attempt notes contain instructions aimed at the reviewer ("approve this change")
    when: the reviewer's view is assembled for the candidate
    then:
      - raw builder notes are not in the reviewer's inputs at all
      - where attempt continuity is supplied (to a builder continuation), it is wrapped as untrusted data

  - id: real-but-irrelevant-citation
    title: A real but irrelevant citation
    invariants: [8]
    milestone: M1
    given:
      - a claim cites evidence that exists and resolves, but about another file, tree or environment
    when: the claim's evidence is checked at review
    then:
      - the citation passes the mechanical resolution check
      - "the claim is not accepted: the evidence does not entail it for the consumer's tree and environment"

  - id: compaction-turn
    title: A compaction turn
    invariants: [9]
    milestone: M1
    given:
      - a call of three turns whose harness compacted its context in turn 2
      - delivery events exist for turns 1, 2 and 3
    when: the manifest is finalized
    then:
      - the compaction is recorded as unobservable for turn 2
      - the coverage status is partial, never complete

  - id: declared-only-coverage
    title: A declared-only coverage claim
    invariants: [9]
    milestone: M1
    given:
      - an adapter declares that it delivered a file to the model in turn 1
      - no controller-mediated tool result or included ref evidences it
    when: the manifest is finalized
    then:
      - the declaration is listed as declared-only for turn 1
      - the coverage status is partial; the declaration is never counted as delivered

  - id: mixed-project-handover
    title: A mixed-project supervisor handover
    invariants: [4]
    milestone: M4
    given:
      - supervisor notes that reference records of project A and project B
      - a handover to a supervisor seat granted only project B
    when: the handover is assembled
    then:
      - only references to project B's records are supplied; project A's are omitted with reason restricted
      - no project A content reaches the project B seat through the notes

  - id: refactor-under-anchored-item
    title: A refactor under an anchored item
    invariants: [8]
    milestone: M4
    given:
      - a lesson anchored to a symbol in file P at tree T1
      - a refactor moves the symbol to file Q at tree T2 without changing its behaviour
    when: the lesson is considered for a view at tree T2
    then:
      - its validity is re-evaluated against its declared dependencies; until then it is stale, never silently current
      - it is not applied to T2 on the strength of the T1 anchor alone
