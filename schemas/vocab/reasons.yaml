# SPDX-License-Identifier: Apache-2.0
# The reason-code registry (docs/design/m0/02 "Reason codes"). Writers may emit
# only registered, non-deprecated codes; readers accept every code ever
# registered. A code is never reused for another meaning. `source` names where
# the code was introduced (a design note, or a legacy golden in
# fixtures/legacy/ for codes proposed there).
schema: adc.vocab.reasons/v1
reasons:
  # --- generic completions ---------------------------------------------------
  - {code: completed_with_findings, outcomes: [found], domain: cycle, introduced: 0.1.0, deprecated: null, source: "02", description: "The check ran completely and found something."}
  - {code: completed_clean, outcomes: [empty], domain: cycle, introduced: 0.1.0, deprecated: null, source: "02", description: "The check ran completely and found nothing."}

  # --- capacity --------------------------------------------------------------
  - {code: quota_exhausted, outcomes: [could_not_run], domain: capacity, hold: quota_reset, introduced: 0.1.0, deprecated: null, source: "02", description: "The leased source reported its quota as exhausted."}
  - {code: capacity_reserved_full, outcomes: [could_not_run], domain: capacity, hold: capacity_released, introduced: 0.1.0, deprecated: null, source: "05", description: "Outstanding reservations fill the resource group's known limit, so the grant reserves nothing; the lease stays requested until a settlement or release returns capacity to the group."}
  - {code: budget_rail_reached, outcomes: [could_not_run], domain: capacity, hold: budget_rail, introduced: 0.1.0, deprecated: null, source: "05", description: "A USD rail would be passed by the next lease: the task's spend (per_task_usd) or its project's on the grant's UTC day (per_day_usd), settled calls at their priced usage and unsettled ones at their liabilities, with the lease's priced reservation. Nothing is placed, and the node holds budget_rail until the operator raises the task's rail (task.raise_rail) or the project's profile changes (M1 P17b). A lease's whole spend, usage past its reservation included, is charged to its grant's UTC day, so spend within one calendar day can reach about twice per_day_usd."}
  - {code: quota_unknown, outcomes: [could_not_run], domain: capacity, hold: quota_reset, introduced: 0.1.0, deprecated: null, source: "02", description: "The source's remaining quota cannot be determined; the probe schedule applies."}
  - {code: broker_credit_exhausted, outcomes: [could_not_run], domain: capacity, hold: broker_credit_exhausted, introduced: 0.1.0, deprecated: null, source: "05", description: "The broker balance cannot cover the reservation (402, or stale/unknown balance). Partial work is sealed, never read as no changes."}
  - {code: routing_violation, outcomes: [failed], domain: capacity, introduced: 0.1.0, deprecated: null, source: "02", description: "The destination is outside the project's allowed set; refused before egress."}
  - {code: fallback_scope, outcomes: [failed], domain: capacity, introduced: 0.1.0, deprecated: null, source: "legacy:f16-inline-fallback", description: "The fallback chain entry is not authorised for this role and mode; refused in the placement path."}
  - {code: inconsistent_usage, outcomes: [found], domain: capacity, introduced: 0.1.0, deprecated: null, source: "05", description: "A final usage report is lower than the sum of its deltas; the larger figure is kept until reconciled."}

  # --- attempts, leases, effects ---------------------------------------------
  - {code: stale_attempt, outcomes: [failed], domain: cycle, introduced: 0.1.0, deprecated: null, source: "05", description: "Output from an attempt whose id or fencing token is not current, or whose publication is closed."}
  - {code: idempotency_key_reused, outcomes: [failed], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "A command repeats an idempotency key with a different input."}
  - {code: stale_expected_state, outcomes: [failed], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "The command's expected object version or digest is not current."}
  - {code: ambiguous_state, outcomes: [could_not_run], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "A projection found two live records where one is allowed, or the controller found at startup a state it cannot read as one history (a lease granted before capacity was wired, actors without exactly one system actor, events without any actor); fails closed."}
  - {code: controller_already_running, outcomes: [could_not_run], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "Another adcd holds the state directory lock."}
  - {code: log_integrity_broken, outcomes: [failed], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "The event log fails verification: a gap, a broken hash link, an edited event, or (against a trusted head) truncation or a rewritten tail."}
  - {code: store_unreadable, outcomes: [could_not_run], domain: ops, introduced: 0.1.0, deprecated: null, source: "03", description: "The event store or its lock cannot be opened or read, so the log was not checked; never read as intact."}

  # --- gate, accept, evidence -------------------------------------------------
  - {code: protected_path, outcomes: [failed], domain: gate, introduced: 0.1.0, deprecated: null, source: "02", description: "The patch touches a protected path outside the protected-document operation."}
  - {code: test_integrity_violation, outcomes: [failed], domain: gate, introduced: 0.1.0, deprecated: null, source: "02", description: "A test was deleted or skipped, or an assertion removed, without an approved row (conclusive)."}
  - {code: candidate_owned_setup_error, outcomes: [found], domain: gate, introduced: 0.1.0, deprecated: null, source: "legacy:edge-owned-errors", description: "A setup/teardown error in a test file the candidate added or changed, fully accounted; routed to a builder repair (07 ownership rules)."}
  - {code: runner_fault, outcomes: [could_not_run], domain: gate, hold: wrong_owner, introduced: 0.1.0, deprecated: null, source: "legacy:edge-owned-errors", description: "Gate output that is not candidate-owned (collection error, untouched file, unaccounted count, external import error, unknown base); goes to the environment owner."}
  - {code: controller_run_failed, outcomes: [could_not_run], domain: gate, hold: source_invalid_config, introduced: 0.1.0, deprecated: null, source: "02", description: "The controller's own run of an accept or gate node failed before its verdict: its sandbox, its clone or image (the configuration's), its run or its bound. Never a green; the node holds source_invalid_config on the runner's signal, a bounded retry or the profile's."}
  - {code: gate_test_failed, outcomes: [found], domain: gate, introduced: 0.1.0, deprecated: null, source: "legacy:edge-owned-errors", description: "A test failed relative to the measured baseline."}
  - {code: receipt_incomplete, outcomes: [could_not_run], domain: gate, hold: awaiting_receipt, introduced: 0.1.0, deprecated: null, source: "06", description: "A required predicate or its evidence media is missing; never derives empty."}
  - {code: instrument_changed, outcomes: [could_not_run], domain: gate, hold: awaiting_receipt, introduced: 0.1.0, deprecated: null, source: "06", description: "The instrument digest changed; dependent requirements must be re-run."}
  - {code: evidence_inapplicable, outcomes: [could_not_run], domain: gate, hold: awaiting_receipt, introduced: 0.1.0, deprecated: null, source: "02", description: "A valid receipt does not apply (other subject, tree, environment, contract revision or demand)."}
  - {code: evidence_observed, outcomes: [found], domain: gate, introduced: 0.1.0, deprecated: null, source: "legacy:f16-walk-demand", description: "An evidence run for this demand produced its receipt."}
  - {code: evidence_cap_exhausted, outcomes: [could_not_run], domain: gate, hold: wrong_owner, introduced: 0.1.0, deprecated: null, source: "12", description: "Attempts for this subject reached the total cap across demands."}
  - {code: precondition_failed, outcomes: [could_not_run], domain: gate, hold: precondition_failed, introduced: 0.1.0, deprecated: null, source: "12", description: "An environment precondition failed before the run: an instrument's (12), or the adapter host's ingestion capabilities (09); no attempt is spent."}
  - {code: isolation_unproven, outcomes: [could_not_run], domain: gate, introduced: 0.1.0, deprecated: null, source: "12", description: "The isolation probe inside the evidence run's wrapper did not prove the run isolated: an empty setting, a probe from another run, or the host network seen. The result is never published; the attempt counts as spent."}

  # --- review and closure -----------------------------------------------------
  - {code: review_input_changed, outcomes: [found], domain: review, introduced: 0.1.0, deprecated: null, source: "legacy:f16-walk-demand", description: "A review input changed (new answer, new demand, changed conclusions), so a successor review is required."}
  - {code: conclusions_unchanged, outcomes: [empty], domain: review, introduced: 0.1.0, deprecated: null, source: "legacy:f16-walk-demand", description: "A new receipt has the conclusions_digest the reviewer already saw; no new review is required."}
  - {code: reviewer_not_independent, outcomes: [could_not_run], domain: review, hold: reviewer_unavailable, introduced: 0.1.0, deprecated: null, source: "06", description: "No reviewer family disjoint from every contributor is available; unknown family counts as not independent."}
  - {code: closure_repair, outcomes: [found], domain: review, introduced: 0.1.0, deprecated: null, source: "legacy:closure-record-finding-r4", description: "A finding about the closing record; routed to a new closure step, never to the builder."}
  - {code: p3_banked, outcomes: [found], domain: review, introduced: 0.1.0, deprecated: null, source: "legacy:closure-record-finding-r4", description: "A P3 finding banked as background work (plan §2.5)."}

  # --- authority --------------------------------------------------------------
  - {code: authority_revoked, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The actor's grant was revoked, expired or narrowed; streams close with this reason."}
  - {code: seat_not_held, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "08", description: "A supervisor write action without holding the seat."}
  - {code: seat_unavailable, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "08", description: "seat.take cannot change the seat now: the caller already holds it, is not a supervisor, or its own handover request has not reached its force_after."}
  - {code: actor_revoked, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The acting actor is revoked; nothing it asks is allowed."}
  - {code: recipient_not_operator, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "14", description: "An offline operator-credential recovery named a recipient that is not a live operator (missing, revoked or of another kind); nothing is issued or revoked."}
  - {code: action_deferred, outcomes: [could_not_run], domain: authority, introduced: 0.1.0, deprecated: null, source: "14", description: "The action is registered but not wired in this build: it is deferred to its owning milestone (14 D1), and nothing was applied."}
  - {code: action_unregistered, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The action is not in the action registry, or is deprecated; authority classifies only registered, current actions."}
  - {code: change_class_unknown, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The effective change named a class with no confirmation default; refused, never read as no confirmation."}
  - {code: action_not_granted, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "No grant in force (not revoked, within its validity) covers this action on this project for the supervisor."}
  - {code: self_grant_refused, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "A supervisor asked to create or extend its own grant; grants are never created or extended by the grantee."}
  - {code: action_not_proposable, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The command would be proposed, but the action is never recorded as a proposal: its derivation mints its object (note.add) or it is a direct act on a proposal (proposal.withdraw); refused before any proposal is recorded."}
  - {code: actor_kind_refused, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "08", description: "The action is not one this kind of actor performs (note.add: operators and supervisors only)."}
  - {code: grant_not_issuable, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "grant.create names a grant that cannot be issued now: its id is already taken, its expiry is not after the time it would be applied, or its grantee is not a live supervisor. At a proposal's application the proposal is invalidated instead (proposal_invalidated)."}
  - {code: protected_change_widens, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "A protected document or topology change whose effective change also widens authority or data policy; refused for every actor, and the widening goes through its dedicated action."}
  - {code: grant_override_weaker, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "A covering grant overrides the action's confirmation with a policy weaker than the change's default; refused, never silently ignored."}
  - {code: proposal_not_open, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The proposal is not open (or, at apply, not confirmed); a closed proposal is never confirmed, re-opened or applied."}
  - {code: proposal_expired, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The proposal passed its expiry before it was confirmed."}
  - {code: confirmation_refused, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "A confirmation did not count: a challenge used, expired, for another binding or by an actor who may not confirm, or a review that is not a GO for this proposal; also a bootstrap setup secret that is wrong, expired or already spent (04 \"Bootstrap\")."}
  - {code: proposal_invalidated, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "At apply, the confirmed proposal no longer holds: its grant, policy, confirmer or request changed; it is invalidated, never applied."}
  - {code: operator_only, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "The action is an operator's alone in this build: only an operator revokes an actor or issues, revokes or replaces a token, and a supervisor's agent.enrol would wait for a human confirmation this build cannot take (14 R6), so it is refused rather than proposed; and a supervisor's task.cancel of a task it did not create, or that has an approval in force (#226 entry 23)."}
  - {code: actor_protected, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "actor.revoke names the controller's system actor or the last live operator; refused, so the installation never loses its own actor or its last administrator."}
  - {code: token_not_live, outcomes: [failed], domain: authority, introduced: 0.1.0, deprecated: null, source: "04", description: "token.revoke or token.replace names a token that is missing or revoked, or token.issue names a holder that is missing, revoked or the controller's own; nothing is issued or revoked."}

  # --- knowledge --------------------------------------------------------------
  - {code: restriction_dropped, outcomes: [failed], domain: knowledge, introduced: 0.1.0, deprecated: null, source: "10", description: "A ref derived from the manifest's declared inputs does not keep every restriction its lineage inherits."}
  - {code: lineage_undeclared, outcomes: [failed], domain: knowledge, introduced: 0.1.0, deprecated: null, source: "10", description: "A delivered tool result is not a declared input and names no lineage, or lineage outside the manifest's declared inputs."}
  - {code: view_stale, outcomes: [could_not_run], domain: knowledge, introduced: 0.1.0, deprecated: null, source: "10", description: "A cached view's recorded fingerprint differs from the one recomputed over its current inputs, so it is not served but regenerated."}
  - {code: coverage_claim_contradicted, outcomes: [failed], domain: knowledge, introduced: 0.1.0, deprecated: null, source: "10", description: "A finalized manifest's coverage differs from what its delivery evidence derives; a declaration alone never makes it complete."}

  # --- adapters, sandbox, config ---------------------------------------------
  - {code: unsafe_output, outcomes: [failed], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "An adapter output violated the ingestion boundary (symlink, special file, digest mismatch, foreign handle)."}
  # Executor exits (13 "Facts, not claims"): an executor that did not complete is could_not_run, with the reason
  # internal/vocab/exitmap derives from what the controller observed; rate limits and credit exhaustion reuse
  # quota_exhausted and broker_credit_exhausted.
  - {code: attempt_stopped, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "05", description: "The controller requested the attempt's stop (revoke, preempt, expire, drain or cancel; 05 stop_requested) before the executor completed. It does not mean execution or billing ended."}
  - {code: adapter_protocol_error, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "The adapter broke the contract (an invalid or unexpected message) or its process ended without a result."}
  - {code: provider_request_refused, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "The model provider refused the request (an HTTP 4xx other than a rate limit or credit exhaustion)."}
  - {code: provider_unavailable, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "The model provider failed to serve the request (an HTTP 5xx)."}
  - {code: stream_idle_cut, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "The response stream went idle and was cut before it finished."}
  - {code: degenerate_output, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "09", description: "The model's output degenerated (repetition, truncation or garbage) and the run was abandoned."}
  - {code: executor_incomplete, outcomes: [could_not_run], domain: adapter, introduced: 0.1.0, deprecated: null, source: "13", description: "The executor did not complete and nothing observed names a more specific cause."}
  - {code: check_unloadable, outcomes: [could_not_run], domain: ops, introduced: 0.1.0, deprecated: null, source: "02", description: "A check could not load what it checks: the code a source check reads or type-checks, or, at controller startup, the vocabulary registry or the event-kind registrations; it never passes."}
  - {code: upload_bound_exceeded, outcomes: [failed], domain: ops, introduced: 0.1.0, deprecated: null, source: "08", description: "A blob upload is over 1 MiB, or would put its actor over 64 unclaimed uploads or 32 MiB (POST /v1/blobs); nothing was stored."}
  - {code: ready_backlog_full, outcomes: [failed], domain: ops, introduced: 0.1.0, deprecated: null, source: "08", description: "A task.create would put a sixth task in its project's Ready backlog (at most five, D51); nothing was recorded."}
  - {code: project_unconfigured, outcomes: [could_not_run], domain: ops, introduced: 0.1.0, deprecated: null, source: "07", description: "The project has no valid adopted profile; refuse to run."}
