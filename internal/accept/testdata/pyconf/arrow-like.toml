# SPDX-License-Identifier: Apache-2.0
#
# A synthetic pyproject.toml, written for this test: no upstream text. It
# reproduces the shapes of Apache Arrow 17.0.0's python/pyproject.toml
# (github.com/apache/arrow, 6a2e19a852): inline tables as values, keys with
# no blanks around =, single-quoted values; its test extra names pytest,
# and setuptools-scm's "git describe --dirty" main's pyConf read as the
# option --dirty (the widen-b baseline, Opus #296 M1).

[build-system]
requires = [
    "cython >= 0.29.31",
    # a comment between items
    "numpy>=1.25; python_version>='3.9'",
    "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "columnlike"
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache Software License"}
classifiers  = [
    'Programming Language :: Python :: 3.12',
]
maintainers = [
    {name = "The Developers", email = "dev@example.org"}
]

[project.optional-dependencies]
test = [
    'pytest',
    'hypothesis',
]

[tool.setuptools]
zip-safe=false
include-package-data=true

[tool.setuptools.package-data]
columnlike = ["*.pxd", "*.pyx", "includes/*.pxd"]

[tool.setuptools_scm]
root = '..'
version_scheme = 'guess-next-dev'
git_describe_command = 'git describe --dirty --tags --long --match "columnlike-[0-9]*.*"'
fallback_version = '17.0.0'
