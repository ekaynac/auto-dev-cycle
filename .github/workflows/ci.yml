# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: make ci
    # Self-hosted x86 runner in the homelab (ekaynac/homelab docs/services/ci-runner.md):
    # GitHub-hosted minutes ran out. Ubuntu 24.04, same as the ubuntu-24.04 image.
    runs-on: [self-hosted, homelab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
      - name: Enable bubblewrap (the default test sandbox backend)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned Go toolchain (per user)
        run: scripts/bootstrap-go.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable pnpm (the version adapters/package.json pins)
        run: corepack enable && cd adapters && pnpm --version
      - name: make ci
        run: make ci

  fixtures:
    name: T0 fixtures well-formed
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # ts-mini relies on Node's type stripping (22.18+)
      - name: Enable bubblewrap (offline gates)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned Go toolchain (per user)
        run: scripts/bootstrap-go.sh
      - name: make fixtures-check
        run: PATH="$HOME/.local/go/bin:$PATH" make fixtures-check
