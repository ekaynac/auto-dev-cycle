# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: make ci
    # Self-hosted x86 runner in the homelab (ekaynac/homelab docs/services/ci-runner.md):
    # GitHub-hosted minutes ran out. Ubuntu 24.04, same as the ubuntu-24.04 image.
    runs-on: [self-hosted, homelab]
    # Successful runs take about 19 minutes on the one runner (2026-10-21), so a
    # 20-minute limit cut healthy runs, main's included (#226 entry 102).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
      - name: Enable bubblewrap (the default test sandbox backend) and curl (the installed smoke)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap curl
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # A container runner cannot set it; there the host already has it at 0, so write only when needed.
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$f" && "$(cat "$f")" != 0 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install the pinned Go toolchain (per user)
        run: scripts/bootstrap-go.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable pnpm (the version adapters/package.json pins)
        run: corepack enable && cd adapters && pnpm --version
      - name: make ci
        # Two test binaries at once: the runner has 4 GB, and entry.test (1.7 GB) was OOM-killed beside fixtures.test (#417).
        run: make ci GOTEST_P=2

  fixtures:
    name: T0 fixtures well-formed
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # ts-mini relies on Node's type stripping (22.18+)
      - name: Enable bubblewrap (offline gates)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # A container runner cannot set it; there the host already has it at 0, so write only when needed.
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$f" && "$(cat "$f")" != 0 ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install the pinned Go toolchain (per user)
        run: scripts/bootstrap-go.sh
      - name: make fixtures-check
        # On a runner without docker, php-mini reports SKIP (its check.sh); with docker the flag changes nothing.
        run: PATH="$HOME/.local/go/bin:$PATH" ADC_T0_SKIP_WITHOUT_DOCKER=1 make fixtures-check
